<div class="login-wrapper">
  <<div class="login-card">
    <h2 class="login-title"> Admin Giriş</h2>

    <form (ngSubmit)="login()">
      <input type="email" [(ngModel)]="email" name="email" placeholder="E-posta" required />
      <input type="password" [(ngModel)]="password" name="password" placeholder="Şifre" required />
      <button type="submit">Giriş Yap</button>
    </form>

    <div class="error" *ngIf="hataMesaji">{{ hataMesaji }}</div>
  </div>
</div>
