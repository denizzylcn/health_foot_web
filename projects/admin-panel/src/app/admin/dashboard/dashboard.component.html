<h2 class="title">Admin Panel</h2>

<!-- 🟣 Kartlar -->
<div class="card-container">
  <mat-card class="dashboard-card" (click)="goTo('kullanicilar')">
    <div class="icon">👤</div>
    <div class="title">Toplam Kullanıcı</div>
    <div class="value">{{ toplamKullanici }}</div>
  </mat-card>

  <mat-card class="dashboard-card" (click)="goTo('randevular')">
    <div class="icon">📅</div>
    <div class="title">Bekleyen Randevu</div>
    <div class="value">{{ bekleyenRandevu }}</div>
  </mat-card>

  <mat-card class="dashboard-card">
    <div class="icon">✅</div>
    <div class="title">Tamamlanan Randevu</div>
    <div class="value">{{ tamamlananRandevu }}</div>
  </mat-card>

  <mat-card class="dashboard-card" (click)="goTo('yorumlar')">
    <div class="icon">💬</div>
    <div class="title">Toplam Yorum</div>
    <div class="value">{{ yorumSayisi }}</div>
  </mat-card>
</div>

<!-- 🗓️ Yaklaşan Randevular -->
<div class="panel-section">
  <h3>Yaklaşan Randevular</h3>
  <div class="card-container">
    <mat-card class="dashboard-card" *ngFor="let r of yaklasanRandevular">
      <div class="icon">🗓️</div>
      <div class="title">
        {{ r.tarih | date:'dd MMMM yyyy' }} - {{ r.saat }}
      </div>
      <div class="value" style="font-size: 16px; font-weight: normal;">
        {{ r.ad }}
      </div>
    </mat-card>
  </div>
</div>
