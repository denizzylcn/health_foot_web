<section class="contact-hero">
  <h1>Bize Ulaşın</h1>
  <p>
    Hizmetlerimize ilişkin aklınıza takılan tüm sorularınız ile danışmak istediğiniz tüm sorular için bize ulaşmaktan çekinmeyin.
    Uzman ekibimiz sorularınızı memnuniyetle yanıtlayarak size yardımcı olacaktır.
  </p>
</section>

<div class="contact-container">
  <div class="tab-buttons">
    <button class="active">İletişim Formu</button>
  </div>

  <form class="contact-form" (ngSubmit)="submitForm()" #form="ngForm">
    <div class="form-group">
      <label>Ad Soyad *</label>
      <input type="text" [(ngModel)]="nameSurname" name="nameSurname" required />
    </div>
    <div class="form-group">
      <label>E-posta Adresi *</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>
    <div class="form-group">
      <label>Telefon Numarası</label>
      <input type="tel" [(ngModel)]="phone" name="phone" />
    </div>
    <div class="form-group">
      <label>Mesajınız *</label>
      <textarea rows="4" [(ngModel)]="messageContent" name="messageContent" required></textarea>
    </div>
    <div class="form-group checkbox">
      <label>
        <input type="checkbox" required /> KVKK Aydınlatma Metni’ni okudum, kabul ediyorum.
      </label>
    </div>
    <button type="submit" class="submit-button">Gönder</button>
  </form>
</div>
