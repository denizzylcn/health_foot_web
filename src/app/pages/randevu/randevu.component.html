<div class="randevu-wrapper">
  <h2>Randevu Oluştur</h2>

  <!-- Test mesajı -->
  <div *ngIf="mesaj" [ngClass]="mesajTipi === 'basari' ? 'toast-success' : 'toast-error'">
    {{ mesaj }}
  </div>

  <form (ngSubmit)="randevuAl()" #form="ngForm" novalidate>
    <label for="tarih">Tarih:</label>
    <input
      type="date"
      id="tarih"
      name="tarih"
      [(ngModel)]="tarih"
      (change)="tarihDegisti()"
      required
    >

    <label for="saat">Saat:</label>
    <select id="saat" name="saat" [(ngModel)]="saat" required>
      <option *ngFor="let s of saatler" [value]="s" [disabled]="doluSaatler.includes(s)">
        {{ s }} <span *ngIf="doluSaatler.includes(s)"> (Dolu)</span>
      </option>
    </select>

    <label for="aciklama">Açıklama:</label>
    <input type="text" id="aciklama" name="aciklama" [(ngModel)]="aciklama" required>

    <label for="email">E-posta:</label>
    <input type="email" id="email" name="email" [(ngModel)]="email" required><br>

    <label for="telefon">Telefon:</label>
    <input type="tel" id="telefon" name="telefon" [(ngModel)]="telefon" required><br>

    <button type="submit">Randevu Oluştur</button>
  </form>

  <!-- Yukarı Çık Butonu -->
  <button class="scroll-to-top" (click)="scrollToTop()">↑</button>
</div>
